[package]
name = "c77merge-bin"
version = "0.1.0"
edition.workspace = true

# [[bin]]
# name = "updatemods"

[[bin]]
name = "merge"

[dependencies]
acf = { version = "0.1", path = "../acf" }
c77conf = { version = "0.1", path = "../c77conf" }
c77merge = { version = "0.1", path = "../c77merge" }
nexusapi = { version = "0.1", path = "../nexusapi" }
ovfs = { version = "0.1", path = "../ovfs" }
clap = { version = "4.5", features = ["derive", "wrap_help", "unicode"] }
# env_logger = "0.11"
futures = "0.3"
human-panic = "2.0"
miette = { version = "7.6", features = ["fancy"] }
itertools = "0.8"
# log = "0.4"
# pot = "3.0" # for saving state
# termtree = "0.5" # tree of any type
tokio = { version = "1.42", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "tracing-log",
    "env-filter",
    "local-time",
] }
