[package]
name = "profile_from_downloads"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
c77conf = { path = "../../libs/c77conf", version = "0.1", features = ["nexus"] }
libc77 = { path = "../../libs/libc77", version = "0.1" }
nexusapi = { path = "../../libs/nexusapi", version = "0.1" }

clap = { version = "4.5", features = ["derive", "unicode", "wrap_help"] }
futures = "0.3"
itertools = "0.15"
miette = { version = "7.6", features = ["fancy"] }
tokio = { version = "1.42", features = ["full"] }
tracing = "0.1"
tracing-subscriber = {
  version = "0.3",
  features = [
    "env-filter",
    "local-time",
    "tracing-log",
  ]
}
tracing-tree = "0.4"

[lints]
workspace = true
