[package]
name = "merge"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
acf = { path = "../../libs/acf", version = "0.1" }
c77conf = { path = "../../libs/c77conf", version = "0.1" }
libc77 = { path = "../../libs/libc77", version = "0.1" }
ovfs = { path = "../../libs/ovfs", version = "0.1" }

clap = { version = "4.5", features = ["derive", "unicode", "wrap_help"] }
itertools = "0.15"
miette = { version = "7.6", features = ["fancy"] }
tokio = { version = "1.42", features = ["full"] }
tracing = "0.1"
tracing-subscriber = {
  version = "0.3",
  features = [
    "env-filter",
    "local-time",
    "tracing-log",
  ]
}
tracing-tree = "0.4"

[lints]
workspace = true
