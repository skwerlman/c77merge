[package]
name = "c77conf"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
config = "0.15"
fs-err = "3.2"
miette = "7.6"
serde = { version = "1.0", features = ["derive"] }
shellexpand = { version = "3.1", features = ["full"] }
thiserror = "2.0"
toml = "1.1"
toml_edit = { version = "0.25", features = ["serde"] }
tracing = "0.1"


nexusapi = { path = "../nexusapi", version = "0.1", optional = true }

[features]
default = []
nexus = ["nexusapi"]

[lints]
workspace = true
