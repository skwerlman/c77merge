[package]
name = "nexusapi"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1"
cacache = {
  version = "13.1.0",
  default-features = false,
  features = ["libc", "mmap", "tokio-runtime"]
}
chrono = { version = "0.4", features = ["serde"] }
http = "1.3"
http-cache-reqwest = { version = "1.0.0-alpha.4", features = ["manager-moka", "manager-cacache"] }
miette = "7.6"
moka = { version = "0.12", features = ["future"] }
regex = "1.12"
reqwest = {
  version = "0.13",
  features = [
    "brotli",
    "deflate",
    "gzip",
    "json",
    "zstd",
  ]
}
reqwest-middleware = "0.5"
reqwest-ratelimit = "0.5"
reqwest-retry = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.42", features = ["full"] }
tracing = "0.1"

[build-dependencies]
convert_case = "0.12"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
version_check = "0.9"

[lints]
workspace = true
